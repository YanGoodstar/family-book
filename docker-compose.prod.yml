# 生产环境部署配置 - 使用预构建 JAR
version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: family-book-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: family_book
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./family-book-server/src/main/resources/db/migration:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:3307:3306"
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+08:00
    networks:
      - family-book-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USERNAME}", "-p${DB_PASSWORD}"]
      timeout: 20s
      retries: 10

  app:
    image: eclipse-temurin:17-jre-alpine
    container_name: family-book-app
    restart: always
    environment:
      TZ: Asia/Shanghai
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      WX_APPID: ${WX_APPID}
      WX_SECRET: ${WX_SECRET}
      SERVER_PORT: 9000
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: "-Xms256m -Xmx768m -Djava.security.egd=file:/dev/./urandom"
    command: >
      sh -c "apk add --no-cache tzdata &&
             ln -snf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime &&
             echo Asia/Shanghai > /etc/timezone &&
             java $JAVA_OPTS -jar /app/app.jar --spring.profiles.active=$${SPRING_PROFILES_ACTIVE} --server.port=$${SERVER_PORT}"
    ports:
      - "127.0.0.1:9000:9000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - family-book-network
    volumes:
      - ./logs:/var/log/family-book
      - ./family-book-server/target/family-book-server-1.0.0.jar:/app/app.jar:ro

  nginx:
    image: nginx:alpine
    container_name: family-book-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./family-book-server/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./family-book-server/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./family-book-server/nginx/ssl:/etc/nginx/ssl:ro
      - ./family-book-server/nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - app
    networks:
      - family-book-network

volumes:
  mysql_data:
    driver: local

networks:
  family-book-network:
    driver: bridge
