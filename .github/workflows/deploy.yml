name: Deploy to Production

on:
  push:
    branches: [ master, main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: |
        cd family-book-server
        mvn clean package -DskipTests

    - name: Copy JAR and config to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        source: "family-book-server/target/family-book-server-*.jar,docker-compose.prod.yml"
        target: "/opt/family-book/"
        overwrite: true

    - name: Deploy on server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          cd /opt/family-book
          # 确保目录结构正确
          mkdir -p family-book-server/target
          # 移动 JAR 到正确位置（如果SCP放错了位置）
          ls -la family-book-server/target/ || mv family-book-server-*.jar family-book-server/target/ 2>/dev/null || true
          ls -la family-book-server/target/
          # 使用最新的 docker-compose.prod.yml 启动
          docker compose -f docker-compose.prod.yml down
          docker compose -f docker-compose.prod.yml up -d
          # 等待启动并检查健康
          sleep 15
          curl -f http://localhost:9000/api/v1/health || exit 1
          echo "Deployment successful!"
